
<!DOCTYPE html>
<html lang="en">
<head>

<title>Majere's Mission</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Cinzel+Decorative:wght@700;900&family=Mrs+Saint+Delafield&display=swap');
html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; overscroll-behavior: none; background: #0f0f1a; }
body {

}
.ui-panel {

#nextSwatch.wild-preview { background: linear-gradient(135deg, #ff4fd8, #4fd6ff, #ffd23f, #4fffb0); background-size: 300% 300%; animation: wild-preview-pulse 1.4s ease-in-out infinite; }

#nextSwatch.bomb-preview::before { content: ''; position: absolute; top: -3px; right: -1px; width: 4px; height: 4px; border-radius: 50%; background: #ffb347; box-shadow: 0 0 6px 2px #ff8c00; animation: bomb-spark-pulse 0.8s ease-in-out infinite; }
@keyframes bomb-spark-pulse { 0%,100% { opacity: 0.5; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.3); } }
#nextArrow { font-size: 15px; line-height: 1; color: #fff; text-shadow: 0 0 4px rgba(0,0,0,0.95), 0 0 7px rgba(255,255,255,0.8); }
@keyframes wild-preview-pulse { 0%,100% { background-position: 0% 50%; box-shadow: 0 0 8px rgba(255,255,255,0.3), 0 0 12px rgba(255,79,216,0.75); transform: scale(1); } 50% { background-position: 100% 50%; box-shadow: 0 0 8px rgba(255,255,255,0.3), 0 0 16px rgba(79,214,255,0.9); transform: scale(1.08); } }
.canvas-wrap {
    flex: 1 1 auto; width: 100%; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    margin: 8px 0;
}
canvas {
    background: #05050d; border: 3px solid #2c3e50; border-radius: 14px;

.controls { display: grid; grid-template-columns: repeat(3, clamp(48px, 15vw, 62px)); grid-template-rows: repeat(3, clamp(48px, 15vw, 62px)); gap: 8px; justify-self: center; }

    width: 100%; height: 100%; font-size: clamp(16px, 5vw, 20px); font-weight: bold; color: #fff;
    background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.03) 100%);

}
.controls button:active { background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.1) 100%); }

#right { grid-column: 3; grid-row: 2; }

.side-controls.side-right { width: 46px; justify-self: end; gap: 12px; }
#actionBtn, #diffBtn {
    width: 100%; padding: 4px 3px; font-weight: 700; color: white; border: none; border-radius: 10px;
    height: clamp(52px, 15.5vw, 66px); cursor: pointer; font-size: clamp(11px, 3vw, 13px); line-height: 1.15;

.confirm-box {

.confirm-yes { background: linear-gradient(135deg, #ff6b6b, #e63946); color: #fff; border: none; border-radius: 10px; padding: 12px 22px; font-weight: 700; font-size: clamp(14px,4vw,15px); cursor: pointer; }
.confirm-no { background: transparent; border: 2px solid #00f2fe; color: #00f2fe; border-radius: 10px; padding: 10px 20px; font-weight: 700; font-size: clamp(14px,4vw,15px); cursor: pointer; }
.canvas-wrap { position: relative; }
#startLogo { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; padding: 28px 0 42px; box-sizing: border-box; pointer-events: none; opacity: 1; visibility: visible; transition: opacity 0.35s ease, visibility 0.35s ease; overflow: visible; }
#startLogo.is-hidden { opacity: 0; visibility: hidden; }
#startLogo .logo-art { position: relative; width: min(86%, 510px); text-align: center; filter: drop-shadow(0 0 30px rgba(120,90,220,0.2)); animation: logo-float 4s ease-in-out infinite; overflow: visible; }
#startLogo .rune-ring { position: absolute; top: -52%; left: 50%; width: 108%; aspect-ratio: 1; transform: translateX(-50%); opacity: 0.6; mix-blend-mode: screen; animation: rune-spin 34s linear infinite; }
#startLogo .rune-ring svg { width: 100%; height: 100%; }
#startLogo .logo-particles { position: absolute; inset: -55% -10% -10%; overflow: hidden; }
#startLogo .logo-particles i { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #7ff5ff; box-shadow: 0 0 7px 2px #7ff5ff, 0 0 16px 4px #b98bff; animation: logo-spark 5s ease-in infinite; }
#startLogo .logo-particles i:nth-child(1) { left: 12%; bottom: 8%; animation-delay: -0.4s; } #startLogo .logo-particles i:nth-child(2) { left: 28%; bottom: 22%; animation-delay: -2.1s; } #startLogo .logo-particles i:nth-child(3) { left: 46%; bottom: 4%; animation-delay: -3.4s; } #startLogo .logo-particles i:nth-child(4) { left: 63%; bottom: 20%; animation-delay: -1.2s; } #startLogo .logo-particles i:nth-child(5) { left: 79%; bottom: 7%; animation-delay: -4.1s; } #startLogo .logo-particles i:nth-child(6) { left: 90%; bottom: 26%; animation-delay: -2.8s; }
#startLogo .logo-majeres { position: relative; z-index: 2; padding: 0.3em 0 0.12em; font-family: 'Mrs Saint Delafield', cursive; font-size: clamp(64px, 14vw, 122px); line-height: 1.15; letter-spacing: 1px; background: linear-gradient(180deg, #fff 0%, #7ff5ff 45%, #b98bff 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 8px rgba(180,140,255,0.65)); animation: script-glow 3.6s ease-in-out infinite; }
#startLogo .logo-mission-wrap { position: relative; z-index: 2; margin-top: clamp(-5px, -0.5vw, -1px); }
#startLogo .logo-mission { font-family: 'Black Ops One', Impact, sans-serif; font-size: clamp(31px, 7vw, 62px); letter-spacing: 0.18em; color: #cfd6d1; text-transform: uppercase; -webkit-text-stroke: 1px rgba(20,24,22,0.55); text-shadow: 0 2px 0 rgba(0,0,0,0.6); animation: metal-glow 3.6s ease-in-out infinite; }
#startLogo .logo-rule { width: 60%; height: 2px; margin: 12px auto 0; background: linear-gradient(90deg, transparent, rgba(207,214,209,0.8), transparent); box-shadow: 0 0 10px rgba(127,245,255,0.45); }
@keyframes logo-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes rune-spin { to { transform: translateX(-50%) rotate(360deg); } }
@keyframes logo-spark { 0% { opacity: 0; transform: translateY(0) scale(0.6); } 15% { opacity: 0.9; } 85% { opacity: 0.4; } 100% { opacity: 0; transform: translateY(-130px) scale(1.3); } }
@keyframes script-glow { 0%,100% { filter: drop-shadow(0 0 8px rgba(180,140,255,0.55)) drop-shadow(0 0 18px rgba(120,220,255,0.35)); } 50% { filter: drop-shadow(0 0 17px rgba(180,140,255,0.95)) drop-shadow(0 0 35px rgba(120,220,255,0.7)); } }
@keyframes metal-glow { 0%,100% { color: #cfd6d1; text-shadow: 0 2px 0 rgba(0,0,0,0.6), 0 0 8px rgba(255,177,74,0.25), 0 0 18px rgba(255,177,74,0.12); } 50% { color: #f3efe6; text-shadow: 0 2px 0 rgba(0,0,0,0.6), 0 0 14px rgba(255,177,74,0.6), 0 0 30px rgba(255,177,74,0.35); } }
@media (max-width: 480px) {
    body { padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left)); }
    .ui-panel { padding: 6px 8px; border-radius: 11px; }
    .stat-label, #nextPreview span { font-size: 8px; letter-spacing: 1px; }
    .stat-value { font-size: 14px; }
    .stat-divider { height: 23px; }
    #nextPreview { gap: 2px; }
    .canvas-wrap { margin: 6px 0; }
    .interaction-area { gap: 8px; }
    .controls { grid-template-columns: repeat(3, clamp(44px, 14vw, 56px)); grid-template-rows: repeat(3, clamp(44px, 14vw, 56px)); gap: 6px; }
    .side-controls.side-left { width: 60px; gap: 8px; }
    .side-controls.side-right { width: 38px; gap: 10px; }
    #actionBtn, #diffBtn { height: clamp(46px, 14vw, 58px); font-size: 10px; }
    #muteBtn { width: 28px; height: 28px; }
    .volume-vertical-wrap { width: 34px; height: clamp(76px, 20vw, 100px); }
    #volumeSlider { width: clamp(76px, 20vw, 100px); }
}
@media (orientation: landscape) and (max-height: 500px) {
    body { padding: 4px max(6px, env(safe-area-inset-right)) 4px max(6px, env(safe-area-inset-left)); }
    .ui-panel { padding: 4px 8px; }
    .canvas-wrap { margin: 4px 0; }
    .controls { grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(3, 40px); gap: 5px; }
    .side-controls.side-left { width: 54px; gap: 6px; }
    .side-controls.side-right { width: 34px; gap: 8px; }
    #actionBtn, #diffBtn { height: 40px; }
    #muteBtn { width: 26px; height: 26px; }
    .volume-vertical-wrap { width: 30px; height: 66px; }
    #volumeSlider { width: 66px; }
}
</style>
</head>
<body>
<div class="ui-panel">
    <div class="stat-block">
        <span class="stat-label">Score</span>
        <span class="stat-value" id="scoreValue">0</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-block">
        <span class="stat-label">Level</span>
        <span class="stat-value" id="levelValue">1</span>
    </div>
    <div class="stat-divider"></div>
    <div id="nextPreview"><span>Next</span><div id="nextSwatch"><div id="nextArrow" aria-label="Next block direction"></div></div></div>
    <div class="stat-divider"></div>
    <div class="stat-block">
        <span class="stat-label">Misses</span>
        <span class="stat-value" id="missValue">0/3</span>
    </div>
</div>
<div class="canvas-wrap" id="canvasWrap">
<canvas id="gameCanvas" width="600" height="600"></canvas>
<div id="startLogo" aria-hidden="true">
    <div class="logo-art">
        <div class="rune-ring"><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="logoRingFade" cx="50%" cy="50%" r="50%"><stop offset="70%" stop-color="#b98bff" stop-opacity="0"/><stop offset="100%" stop-color="#b98bff" stop-opacity="0.9"/></radialGradient></defs><circle cx="100" cy="100" r="92" fill="none" stroke="url(#logoRingFade)" stroke-width="1.2"/><circle cx="100" cy="100" r="78" fill="none" stroke="#7ff5ff" stroke-opacity="0.35" stroke-width="0.8" stroke-dasharray="1 7"/><g fill="#b98bff" fill-opacity="0.8"><circle cx="100" cy="8" r="2.2"/><circle cx="192" cy="100" r="2.2"/><circle cx="100" cy="192" r="2.2"/><circle cx="8" cy="100" r="2.2"/></g></svg></div>
        <div class="logo-particles"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="logo-majeres">Majere's</div>
        <div class="logo-mission-wrap"><div class="logo-mission">Mission</div></div>
        <div class="logo-rule"></div>
    </div>
</div>
</div>
<div class="interaction-area">
    <div class="side-controls side-left">
        <button id="actionBtn" onclick="handleActionButtonClick()">Start</button>
        <button id="diffBtn" onclick="toggleDifficulty()">Easy</button>
    </div>
    <div class="controls">
        <button id="up" onclick="moveBlock('up')">▲</button>
        <button id="left" onclick="moveBlock('left')">◀</button>
        <button id="right" onclick="moveBlock('right')">▶</button>
        <button id="down" onclick="moveBlock('down')">▼</button>
    </div>
    <div class="side-controls side-right">
        <button id="muteBtn" onclick="toggleMute()">🔊</button>
        <div class="volume-vertical-wrap">
            <input type="range" id="volumeSlider" min="0" max="100" value="60" oninput="setMusicVolume(this.value/100)">
        </div>
    </div>
</div>
<div id="confirmOverlay" class="confirm-overlay">
    <div class="confirm-box">
        <p>Restart this level?</p>
        <div class="confirm-buttons">
            <button class="confirm-yes" onclick="confirmRestart()">Restart</button>
            <button class="confirm-no" onclick="cancelRestart()">Cancel</button>
        </div>
    </div>
</div>
<script>

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const startLogo = document.getElementById('startLogo');
const colors = ['orange', 'green', 'purple', 'blue'];
const level3WildBlockChance = 1 / 25;
const level6WildBlockChance = 1 / 20;
const level5BombBlockChance = 1 / 30;
const wildBlockStartLevel = { beginner: 1, intermediate: 3, expert: 10 };
const bombBlockStartLevel = { beginner: 3, intermediate: 5, expert: 13 };
const bSize = 40;
let grid = [], particles = [];
let falling = { x: 280, y: 0, color: '', dx: 0, dy: 0, active: false };
let score = 0, totalBursts = 0, baseSpeed = 0.5, speedMultiplier = 1.0;
let isGameOver = false, isGameWon = false, gameStarted = false, isStageClearPending = false, stageClearTimer = null; 
let currentLevel = 1, missedBlocks = 0, maxMisses = 3;
let lastImpactDx = 0, lastImpactDy = 1, difficultyMode = 'beginner';
let stars = [], streaks = [], sparkles = [];
const starColors = ['#ffffff', '#4fd6ff', '#ff6fe0', '#ffd23f', '#8f6bff', '#4fffb0'];
function initStars() {
    stars = [];
    for (let i = 0; i < 80; i++) {
        stars.push({
            x: Math.random() * 600, y: Math.random() * 600,
            r: Math.random() * 2.4 + 1.1,
            color: starColors[Math.floor(Math.random() * starColors.length)],
            phase: Math.random() * Math.PI * 2,
            speed: Math.random() * 1.2 + 0.6
        });
    }
}
function spawnStreak() {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 3;
    streaks.push({
        x: Math.random() * 600, y: Math.random() * 600,
        dx: Math.cos(angle) * speed, dy: Math.sin(angle) * speed,
        len: Math.random() * 65 + 35,
        color: starColors[Math.floor(Math.random() * starColors.length)],
        life: 1.0
    });
}
function spawnSparkle() {
    const s = stars[Math.floor(Math.random() * stars.length)];
    sparkles.push({ x: s.x, y: s.y, color: s.color, life: 1.0 });
}
function updateAndDrawStarfield(time) {
    const bgGrad = ctx.createRadialGradient(300, 300, 0, 300, 300, 440);
    bgGrad.addColorStop(0, '#14142c'); bgGrad.addColorStop(1, '#05050d');
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, 600, 600);
    stars.forEach(s => {
        const twinkle = 0.5 + 0.5 * Math.sin(time * s.speed + s.phase);
        ctx.save(); ctx.globalAlpha = 0.4 + 0.6 * twinkle;
        ctx.shadowColor = s.color; ctx.shadowBlur = 6 + 4 * twinkle;
        ctx.fillStyle = s.color;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    });
    if (Math.random() < 0.035 && streaks.length < 6) spawnStreak();
    streaks.forEach(s => { s.x += s.dx; s.y += s.dy; s.life -= 0.015; });
    streaks = streaks.filter(s => s.life > 0 && s.x > -80 && s.x < 600 && s.y > -80 && s.y < 600);
    streaks.forEach(s => {
        const norm = Math.hypot(s.dx, s.dy) || 1;
        const tailX = s.x - (s.dx / norm) * s.len, tailY = s.y - (s.dy / norm) * s.len;
        const grad = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
        grad.addColorStop(0, s.color); grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.save(); ctx.globalAlpha = s.life; ctx.strokeStyle = grad; ctx.lineWidth = 2.4;
        ctx.shadowColor = s.color; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(tailX, tailY); ctx.stroke(); ctx.restore();
    });
    if (Math.random() < 0.025 && sparkles.length < 4) spawnSparkle();
    sparkles.forEach(sp => { sp.life -= 0.03; });
    sparkles = sparkles.filter(sp => sp.life > 0);
    sparkles.forEach(sp => {
        const size = 10 * (1 - Math.abs(sp.life - 0.5) * 2);
        ctx.save(); ctx.globalAlpha = Math.max(0, sp.life);
        ctx.strokeStyle = sp.color; ctx.lineWidth = 1.4;
        ctx.shadowColor = sp.color; ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(sp.x - size, sp.y); ctx.lineTo(sp.x + size, sp.y);
        ctx.moveTo(sp.x, sp.y - size); ctx.lineTo(sp.x, sp.y + size);
        ctx.stroke(); ctx.restore();
    });
}
initStars();
let nextColor = null, nextSide = null;
const swatchHex = { orange: '#ffa500', green: '#008000', purple: '#800080', blue: '#0000ff' };
const directionArrows = ['&#8595;', '&#8593;', '&#8594;', '&#8592;'];
const directionNames = ['down', 'up', 'right', 'left'];

function pickNextColor() {
    const wildStart = wildBlockStartLevel[difficultyMode] ?? 3;
    const bombStart = bombBlockStartLevel[difficultyMode] ?? 5;
    const wildBlockChance = currentLevel < wildStart ? 0 : (currentLevel >= 6 ? level6WildBlockChance : level3WildBlockChance);
    const bombChance = currentLevel >= bombStart ? level5BombBlockChance : 0;
    const roll = Math.random();
    if (roll < bombChance) {
        nextColor = 'bomb';
    } else if (roll < bombChance + wildBlockChance) {
        nextColor = 'wild';
    } else {
        nextColor = colors[Math.floor(Math.random()*4)];

        el.classList.toggle('bomb-preview', nextColor === 'bomb');
        el.style.background = (nextColor === 'wild' || nextColor === 'bomb') ? '' : swatchHex[nextColor];
    }

}

    freed.forEach(b => {
        b.isMoving = true;
        let speedVariance = 0.7 + Math.random() * 0.6;
        b.fallDx = pushX * speedVariance;
        b.fallDy = pushY * speedVariance;
        b.rotation = 0;
        b.rotationSpeed = (Math.random() - 0.5) * 0.18;
        b.wobbleSeed = Math.random() * Math.PI * 2;
        b.wobbleAmp = 1.5 + Math.random() * 2.5;
    });
    let dirX = Math.sign(pushX), dirY = Math.sign(pushY);
    let allMoving = grid.filter(b => b.isMoving);
    let ordered = allMoving.slice().sort((a2, b2) => (b2.x * dirX + b2.y * dirY) - (a2.x * dirX + a2.y * dirY));
    let resolvedLandings = new Set();
    ordered.forEach(b => {
        let bPushX = b.fallDx > 0 ? bSize : (b.fallDx < 0 ? -bSize : 0);
        let bPushY = b.fallDy > 0 ? bSize : (b.fallDy < 0 ? -bSize : 0);
        let origin = { x: Math.round(b.x / bSize) * bSize, y: Math.round(b.y / bSize) * bSize };
        let landing = predictLanding(origin, bPushX, bPushY, resolvedLandings, connected);
        b.willCollide = !!landing;
        if (landing) {
            b.landingX = landing.x; b.landingY = landing.y;
            resolvedLandings.add(landing.x + '_' + landing.y);
        } else {
            b.landingX = undefined; b.landingY = undefined;
        }
    });
    if (grid.filter(b => !b.isMoving).length <= 1 && !isStageClearPending) {
        isStageClearPending = true;
        stageClearTimer = setTimeout(attemptStageClear, freed.length === 0 ? 300 : 1000);
    }
}
function processDynamicUntetheredPhysics() {
    let hasChanges = false;
    for (let i = 0; i < grid.length; i++) {
        let b = grid[i]; if (!b.isMoving) continue;
        if (b.fallDx !== 0) b.fallDx += Math.sign(b.fallDx) * 0.12;
        if (b.fallDy !== 0) b.fallDy += Math.sign(b.fallDy) * 0.12;
        b.rotation = (b.rotation || 0) + (b.rotationSpeed || 0);
        b.x += b.fallDx; b.y += b.fallDy;
        hasChanges = true;
        if (b.willCollide) {
            let reachedX = b.fallDx === 0 || (b.fallDx > 0 ? b.x >= b.landingX : b.x <= b.landingX);
            let reachedY = b.fallDy === 0 || (b.fallDy > 0 ? b.y >= b.landingY : b.y <= b.landingY);
            if (reachedX && reachedY) {
                b.isMoving = false;
                b.x = b.landingX; b.y = b.landingY;
                b.rotation = 0;
                playKlink();
                if (b.x <= 0 || b.x >= 560 || b.y <= 0 || b.y >= 560) {
                    triggerGameOver();
                }
            }
        }
    }
    let oldLength = grid.length; grid = grid.filter(b => b.x >= -40 && b.x <= 640 && b.y >= -40 && b.y <= 640);
    if (grid.length !== oldLength) hasChanges = true;
    if (hasChanges && !isGameOver && !isGameWon) { checkBurst(); if (!isStageClearPending && !grid.some(b => b.isMoving)) spawnFalling(); }
}
function createExplosion(x, y, color) {
    let pColors = { orange: 'orange', green: 'green', purple: 'purple', blue: 'blue' };
    let hex = pColors[color] || '#ffffff';
    for (let i = 0; i < 15; i++) { particles.push({ x: x, y: y, dx: (Math.random() - 0.5) * 6, dy: (Math.random() - 0.5) * 6, radius: Math.random() * 3 + 1, alpha: 1, color: hex }); }
}
function drawGlassBlock(x, y, color, rotation) {
    let themes = {
        orange: ['#ffb347', '#e08600', '#5c3000'],
        green:  ['#3fbf5f', '#007a2e', '#00330f'],
        purple: ['#a83fd6', '#6a0d91', '#2b0038'],
        blue:   ['#3d5fff', '#0022c4', '#000640'],
        white:  ['#ffffff', '#cfd8de', '#7c8894']
    };
    let wildScale = 1;
    if (color === 'wild') {
        const t = performance.now();
        const hue = (t / 5) % 360;
        const throb = 0.5 + 0.5 * Math.sin(t / 180);
        const sat = 88 + throb * 12;
        themes.wild = [
            `hsl(${hue}, ${sat}%, ${56 + throb * 16}%)`,
            `hsl(${(hue + 90) % 360}, ${sat}%, ${32 + throb * 16}%)`,
            `hsl(${(hue + 200) % 360}, 90%, ${12 + throb * 6}%)`
        ];
        wildScale = 1 + 0.1 * Math.sin(t / 150);
    }
    if (color === 'bomb') {
        themes.bomb = ['#5c5c5c', '#161616', '#000000'];
    }
    let [light, mid, dark] = themes[color] || themes['white'];
    ctx.save();
    if (rotation || wildScale !== 1) {
        const cx = x + bSize / 2, cy = y + bSize / 2;
        ctx.translate(cx, cy);
        if (rotation) ctx.rotate(rotation);
        if (wildScale !== 1) ctx.scale(wildScale, wildScale);
        ctx.translate(-cx, -cy);
    }
    if (color === 'wild') {
        ctx.shadowColor = mid; ctx.shadowBlur = 16 + 10 * (0.5 + 0.5 * Math.sin(performance.now() / 180));
    } else {
        ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 7;
    }
    ctx.shadowOffsetY = 3;
    let grad = ctx.createLinearGradient(x, y, x + bSize, y + bSize);
    grad.addColorStop(0, light); grad.addColorStop(0.5, mid); grad.addColorStop(1, dark);
    ctx.globalAlpha = 0.9; ctx.fillStyle = grad;
    ctx.beginPath(); ctx.roundRect(x, y, bSize - 2, bSize - 2, 8); ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.globalAlpha = 0.5; ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.beginPath(); ctx.moveTo(x + 2, y + 2); ctx.lineTo(x + bSize - 4, y + 2); ctx.lineTo(x + bSize - 10, y + 12); ctx.lineTo(x + 6, y + 12); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 0.85;
    let dotGrad = ctx.createRadialGradient(x + 10, y + 9, 0, x + 10, y + 9, 6);
    dotGrad.addColorStop(0, 'rgba(255,255,255,0.95)'); dotGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = dotGrad;
    ctx.beginPath(); ctx.arc(x + 10, y + 9, 6, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.4; ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(x + 1.5, y + 1.5, bSize - 5, bSize - 5, 7); ctx.stroke();
    ctx.globalAlpha = 1; ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(x, y, bSize - 2, bSize - 2, 8); ctx.stroke();
    if (color === 'bomb') {
        const flicker = 0.6 + 0.4 * Math.sin(performance.now() / 60);
        ctx.strokeStyle = '#8a7250'; ctx.lineWidth = 2; ctx.globalAlpha = 1;
        ctx.beginPath(); ctx.moveTo(x + bSize/2, y + 2); ctx.quadraticCurveTo(x + bSize/2 + 4, y - 4, x + bSize/2 + 2, y - 8); ctx.stroke();
        ctx.shadowColor = '#ff8c00'; ctx.shadowBlur = 8 + flicker * 6;
        ctx.fillStyle = `rgba(255, ${140 + flicker * 60}, 40, ${0.7 + flicker * 0.3})`;
        ctx.beginPath(); ctx.arc(x + bSize/2 + 2, y - 8, 3 + flicker * 1.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
}
function drawStartLogo(time) {
    const pulse = 0.8 + 0.2 * Math.sin(time * 1.4);
    const shimmer = 0.5 + 0.5 * Math.sin(time * 2.3);
    const floatY = Math.sin(time * 1.6) * 3;
    ctx.save();
    ctx.textAlign = 'center';
    const haloGrad = ctx.createRadialGradient(300, 275 + floatY, 10, 300, 275 + floatY, 180);
    haloGrad.addColorStop(0, `rgba(143,107,255,${0.28 * pulse})`);
    haloGrad.addColorStop(0.5, `rgba(79,214,255,${0.14 * pulse})`);
    haloGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = haloGrad;
    ctx.beginPath(); ctx.arc(300, 275 + floatY, 180, 0, Math.PI * 2); ctx.fill();

    // Slowly orbiting runes give the title screen a living, magical feel.
    for (let i = 0; i < 10; i++) {
        const angle = time * 0.7 + (Math.PI * 2 * i / 10);
        const radius = 132 + Math.sin(time * 2 + i) * 8;
        const x = 300 + Math.cos(angle) * radius;
        const y = 275 + floatY + Math.sin(angle) * radius * 0.42;
        ctx.save();
        ctx.globalAlpha = 0.25 + 0.45 * (0.5 + 0.5 * Math.sin(time * 3 + i));
        ctx.fillStyle = i % 2 ? '#4fd6ff' : '#ff6fe0';
        ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(x, y, 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    ctx.font = "900 42px 'Cinzel Decorative', Georgia, serif";
    ctx.shadowColor = 'rgba(79,214,255,0.9)'; ctx.shadowBlur = 26 * pulse;
    let grad1 = ctx.createLinearGradient(120 + shimmer * 50, 235, 480 + shimmer * 50, 275);
    grad1.addColorStop(0, '#ffffff'); grad1.addColorStop(0.4, '#4fd6ff'); grad1.addColorStop(0.75, '#8f6bff'); grad1.addColorStop(1, '#ff6fe0');
    ctx.fillStyle = grad1;
    ctx.fillText("MAJERE'S", 300, 258 + floatY);

    ctx.font = "400 50px 'Black Ops One', Impact, sans-serif";
    ctx.shadowColor = 'rgba(255,111,224,0.9)'; ctx.shadowBlur = 30 * pulse;
    let grad2 = ctx.createLinearGradient(130 - shimmer * 45, 280, 470 - shimmer * 45, 325);
    grad2.addColorStop(0, '#ff6fe0'); grad2.addColorStop(0.5, '#ffd23f'); grad2.addColorStop(1, '#4fffb0');
    ctx.fillStyle = grad2;
    ctx.fillText("MISSION", 300, 315 + floatY);

    ctx.globalAlpha = 0.65 + shimmer * 0.3;
    ctx.strokeStyle = '#4fd6ff'; ctx.lineWidth = 1.2;
    ctx.shadowColor = '#4fd6ff'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(195, 331 + floatY); ctx.lineTo(405, 331 + floatY); ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.restore();
}
function gameLoop() {
    updateAndDrawStarfield(performance.now() / 1000);
    if(!gameStarted) {
        startLogo.classList.remove('is-hidden');
        ctx.fillStyle = "rgba(10, 10, 20, 0.5)"; ctx.fillRect(0, 0, 600, 600);
        ctx.font = "16px sans-serif"; ctx.fillStyle = "#8b9bbc"; ctx.textAlign = "center"; ctx.fillText("Press Start to Activate Grid", 300, 490);
        requestAnimationFrame(gameLoop); return;
    }
    startLogo.classList.add('is-hidden');
    if (!isPaused) processDynamicUntetheredPhysics();
    if(falling.active && !isGameOver && !isGameWon && !isPaused) {
        falling.x += falling.dx; falling.y += falling.dy;
        if(falling.x < -40 || falling.x > 600 || falling.y < -40 || falling.y > 600) {
            missedBlocks++; updateUI();
            stopWildHum();
            if (missedBlocks >= maxMisses) {
                triggerGameOver();
            } else { spawnFalling(); }
        }
        // Only the block directly ahead in the incoming block's travel lane can stop it.
        // Nearby side blocks must not count as an impact after a sideways slide.
        const laneX = Math.round(falling.x / bSize) * bSize;
        const laneY = Math.round(falling.y / bSize) * bSize;
        let hit = grid.find(b => {
            if (b.isMoving) return false;
            if (falling.dx > 0) return b.y === laneY && b.x >= falling.x && b.x - falling.x < bSize;
            if (falling.dx < 0) return b.y === laneY && b.x <= falling.x && falling.x - b.x < bSize;
            if (falling.dy > 0) return b.x === laneX && b.y >= falling.y && b.y - falling.y < bSize;
            return b.x === laneX && b.y <= falling.y && falling.y - b.y < bSize;
        });
        if(hit && !isGameOver) {
            playKlink();
            stopWildHum();
            lastImpactDx = falling.dx; lastImpactDy = falling.dy;
            let snapX = Math.round((falling.x - falling.dx)/bSize)*bSize; let snapY = Math.round((falling.y - falling.dy)/bSize)*bSize;
            if(grid.some(b => !b.isMoving && b.x === snapX && b.y === snapY)) { snapX = Math.round(falling.x/bSize)*bSize; snapY = Math.round(falling.y/bSize)*bSize; }
            if(snapX <= 0 || snapX >= 560 || snapY <= 0 || snapY >= 560) {
                triggerGameOver();
            }
            if (falling.color === 'bomb') {
                falling.active = false;
                detonateBomb(snapX, snapY);
            } else {
                const landedColor = falling.color === 'wild'
                    ? (hit.color === 'white' ? findClosestColor(snapX, snapY, hit) : hit.color)
                    : falling.color;
                grid.push({ x: snapX, y: snapY, color: landedColor, isMoving: false, fallDx: 0, fallDy: 0 }); falling.active = false; checkBurst();
            }
            if(!isGameOver && !isGameWon && !isStageClearPending) spawnFalling();
        }
    }
    let nowT = performance.now() / 1000;
    grid.forEach(b => {
        let drawX = b.x, drawY = b.y;
        if (b.isMoving && b.wobbleAmp) {
            drawX += Math.sin(nowT * 6 + b.wobbleSeed) * b.wobbleAmp;
            drawY += Math.cos(nowT * 5 + b.wobbleSeed) * (b.wobbleAmp * 0.4);
        }
        drawGlassBlock(drawX, drawY, b.color, b.rotation || 0);
    });
    particles.forEach((p) => { p.x += p.dx; p.y += p.dy; p.alpha -= 0.02; ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore(); });
    particles = particles.filter(p => p.alpha > 0);
    if(falling.active && !isGameOver && !isGameWon) drawGlassBlock(falling.x, falling.y, falling.color);
    if(isGameOver) {
        ctx.fillStyle = "rgba(5, 5, 15, 0.85)"; ctx.fillRect(0, 0, 600, 600);
        ctx.fillStyle = "#ff6b6b"; ctx.font = "bold 38px sans-serif"; ctx.textAlign = "center"; ctx.fillText("GAME OVER", 300, 280);
        ctx.font = "20px sans-serif"; ctx.fillStyle = "#fff"; ctx.fillText(`Final Score: ${score}`, 300, 320);
    }
    if(isGameWon) {
        ctx.fillStyle = "rgba(5, 5, 15, 0.85)"; ctx.fillRect(0, 0, 600, 600);
        ctx.fillStyle = "#00b894"; ctx.font = "bold 38px sans-serif"; ctx.textAlign = "center"; ctx.fillText("STAGE CLEARED", 300, 280);
        ctx.font = "20px sans-serif"; ctx.fillStyle = "#fff"; ctx.fillText(`Click Next Level to Continue`, 300, 320);
    }
    requestAnimationFrame(gameLoop);
}

// ---- Mobile sizing: canvas fills whatever space is left after the UI bar and controls ----
function fitCanvasToScreen() {
    const wrap = document.getElementById('canvasWrap');
    const availW = wrap.clientWidth;
    const availH = wrap.clientHeight;
    const size = Math.max(120, Math.floor(Math.min(availW, availH)));
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
}
window.addEventListener('resize', fitCanvasToScreen);
window.addEventListener('orientationchange', () => setTimeout(fitCanvasToScreen, 60));
document.addEventListener('touchmove', (e) => { if (e.scale !== 1) e.preventDefault(); }, { passive: false });
fitCanvasToScreen();
gameLoop();
</script>
